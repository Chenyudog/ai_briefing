{% extends "base.html" %}
{% block main %}
<header class="edition"><h1>我的手记<span></span></h1></header>
<section class="feed" aria-labelledby="feed-title">
  <div class="feed-heading"><h2 id="feed-title">{{ channels[channel] }}</h2><span>{{ articles|length }} 篇文章</span></div>
  {% for article in articles %}
  <article class="story feed-row">
    <time datetime="{{ article.written_on }}">{{ article.written_on }}</time>
    <div><h3><a href="{{ url_for('detail', article_id=article.id) }}">{{ article.title }}</a></h3>
      <p>{{ article.body|truncate(90, true) }}</p></div>
  </article>
  {% else %}
  <div class="empty"><p>这里还没有发表的文章。</p><a class="button" href="{{ url_for('edit', channel=channel) }}">写第一篇文章</a></div>
  {% endfor %}
</section>
{% endblock %}
