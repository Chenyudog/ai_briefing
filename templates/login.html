{% extends "base.html" %}
{% block title %}{{ '设置管理员密码' if setup else '管理员登录' }} · 我的手记{% endblock %}
{% block main %}
<section class="panel narrow">
  <h1>{{ '设置管理员密码' if setup else '管理员登录' }}</h1>
  {% if setup %}<p class="muted">首次使用，请设置至少 12 个字符的密码。</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>密码<input name="password" type="password" required maxlength="256" autocomplete="{{ 'new-password' if setup else 'current-password' }}"></label>
    {% if setup %}<label>确认密码<input name="confirmation" type="password" required maxlength="256" autocomplete="new-password"></label>{% endif %}
    <button>{{ '设置并登录' if setup else '登录' }}</button>
  </form>
</section>
{% endblock %}
