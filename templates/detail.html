{% extends "base.html" %}
{% block title %}{{ article.title }} · 我的手记{% endblock %}
{% block main %}
<article class="reading">
  <a class="back" href="{{ url_for('home', channel=article.channel) }}">← 返回{{ channels[article.channel] }}</a>
  <div class="meta"><time datetime="{{ article.written_on }}">{{ article.written_on }}</time></div>
  <h1>{{ article.title }}</h1>
  <section class="entry-body">{{ rendered_body }}</section>
</article>
{% endblock %}
